name: Migrate Font Pro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-font-pro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new Font Pro repo
        uses: actions/checkout@v6

      - name: Fetch Font Pro from old repository
        run: |
          git clone --depth=1 https://github.com/dinhloi116-hue/dhlstores.git /tmp/dhlstores

      - name: Copy Font Pro to repository root
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/dhlstores/font-pro/. .
          cp v32-height2.html index.html
          touch .nojekyll
          cat > README.md <<'EOF'
          # Font Pro Studio

          Font Pro Studio — công cụ quản lý/chỉnh sửa font chạy trực tiếp trên Chrome.

          Bản hiện tại: V32.3 — đồng bộ chiều cao A–Z + 0–9 và thay SVG theo từng ký tự.

          GitHub Pages: https://dinhloi116-hue.github.io/font-pro/
          EOF

      - name: Commit migrated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Font Pro V32.3 to standalone repo [skip ci]" || exit 0
          git push
